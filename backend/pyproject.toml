[project]
name = "reel-backend"
version = "0.1.0"
description = "Autonomous News Reel Generator — FastAPI backend"
requires-python = ">=3.11"

[project.scripts]
start = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "supabase>=2.3.0",
    "edge-tts>=6.1.0",
    "moviepy>=1.0.3",
    "Pillow>=10.0.0",
    "static-ffmpeg>=4.5.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
